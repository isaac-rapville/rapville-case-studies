<style>
/* Same system as the case studies page: black stage, Anton display, one purple accent. */
:root{
  --bg:#0A0A0B; --bg-2:#121214; --bg-3:#18181B; --bg-4:#222226;
  --line:#2A2A2F; --line-2:#3A3A40;
  --text:#F5F5F4; --muted:#A1A1AA; --faint:#6B6B73;
  --acc:#A78BFA; --acc-deep:#6D28D9;
  --display:"Anton","Impact","Arial Narrow Bold",sans-serif;
  --body:"Inter","Helvetica Neue",Arial,system-ui,sans-serif;
  --r:16px;
  --gut-l:max(16px,env(safe-area-inset-left,0px));
  --gut-r:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.55;margin:0;overflow-x:hidden}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{width:100%;max-width:1320px;margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r)}

.hero{border-bottom:1px solid var(--line)}
.hero .wrap{padding-block:26px 34px;display:grid;gap:28px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:12px}
.mark b{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.06em;line-height:1}
.mark span{color:var(--muted);font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:600}
.nav{display:flex;gap:8px}
.nav a{height:36px;padding:0 14px;border:1px solid var(--line);border-radius:999px;display:inline-flex;align-items:center;font-size:13.5px;text-decoration:none;background:var(--bg-2)}
.nav a[aria-current="page"]{background:var(--text);color:var(--bg);border-color:var(--text)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(44px,8vw,112px);line-height:.92;margin:0;text-transform:uppercase;max-width:14ch;text-wrap:balance}
h1 em{font-style:normal;color:var(--acc)}
.lede{color:var(--muted);max-width:58ch;margin:0;font-size:17px}

main{padding-block:30px 64px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px;border-bottom:1px solid var(--line);padding-bottom:12px}
.sec-h h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,3.4vw,40px);line-height:1;margin:0;text-transform:uppercase}
.sec-h p{margin:0;color:var(--muted);font-size:14px;max-width:60ch}
.player{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);padding:10px;max-width:1100px;margin:0 auto}
.player .frame{position:relative;padding-bottom:64.5%;border-radius:12px;overflow:hidden;background:var(--bg-4)}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:12px}
.player .alt{margin:12px 6px 4px;font-size:13px;color:var(--muted)}
.player .alt a{color:var(--acc);text-underline-offset:3px}
footer{border-top:1px solid var(--line);color:var(--faint);font-size:12.5px}
footer .wrap{padding-block:20px}

@media (max-width:760px){
  .mapfoot{grid-template-columns:minmax(0,1fr)}
  .cities{border-right:0;border-bottom:1px solid var(--line);flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .depts-wrap::before{left:20%;right:20%}
}
</style>
